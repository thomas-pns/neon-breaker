# Exécutables Windows et macOS, fabriqués à chaque changement de
# moteur/version.py sur main (ou à chaque étiquette v1.2.0), testés,
# puis envoyés au NAS.
# Ils ne sont PAS publiés sur GitHub : le NAS les distribue et sert la
# mise à jour automatique.
#
# À configurer dans GitHub > Settings > Secrets and variables > Actions :
#   NEON_SERVEUR_URL (variable ou secret)  https://neon.votre-nom.synology.me
#   secret   NEON_JETON_DEPLOIEMENT  (le même que dans le .env du NAS)
name: Exécutables

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths: ["moteur/version.py", "outils/envoyer_build.py", ".github/workflows/executables.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à fabriquer (ex. 1.0.0)"
        required: true

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plateforme: windows
            fichier: dist/NeonBreaker.exe
            executable: dist/NeonBreaker.exe
          - os: macos-15
            plateforme: mac_arm
            fichier: dist/NeonBreaker-mac.zip
            executable: dist/NeonBreaker.app/Contents/MacOS/NeonBreaker
          - os: macos-15-intel
            plateforme: mac_intel
            fichier: dist/NeonBreaker-mac.zip
            executable: dist/NeonBreaker.app/Contents/MacOS/NeonBreaker
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then VERSION=$(python -c "import re;print(re.search(r'^VERSION *= *\"([^\"]+)\"', open('moteur/version.py', encoding='utf-8').read(), re.M).group(1))"); fi
          echo "Version : $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller pillow
      - name: Fabrication
        run: python outils/construire.py --version "$VERSION" --serveur "${{ vars.NEON_SERVEUR_URL || secrets.NEON_SERVEUR_URL }}"
      - name: Autotest de l'exécutable
        env:
          NEON_AUTOTEST: "1"
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ${{ matrix.executable }}
      - name: Envoi au NAS
        env:
          NEON_SERVEUR_URL: ${{ vars.NEON_SERVEUR_URL || secrets.NEON_SERVEUR_URL }}
          NEON_JETON_DEPLOIEMENT: ${{ secrets.NEON_JETON_DEPLOIEMENT }}
        run: python outils/envoyer_build.py "${{ matrix.fichier }}" ${{ matrix.plateforme }} "$VERSION"
