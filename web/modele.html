# screen pixels (real, hardware)
WIDTH=1024  # {{cookiecutter.width}}
HEIGHT=600  # {{cookiecutter.height}}

# reference/idealized screen pixels
REFX = 1980
REFY = 1080

def u(real, ref, v):
    if abs(v)<0.9999999:
        result = int( (float(real)/100.0) * (v*1000))
        if v<0:
            return real-result
        return result
    return int( (real/ref) * v )

def ux(*argv):
    global WIDTH, REFX
    acc = 0
    for v in argv:
        acc += u(WIDTH, REFX, v)
    return acc

def uy(*argv):
    global HEIGHT, REFY
    acc = 0
    for v in argv:
        acc += u(HEIGHT, REFY, v)
    return acc

async def custom_site():

    import sys

    import json
    from pathlib import Path

    def compose():
        pygame.display.update()
        window.chromakey(None, *screen.get_colorkey(), 40)

    pygame.init()
    pygame.font.init()

    screen = pygame.display.set_mode([ux(.100),uy(.100)], pygame.SRCALPHA, 32)
    screen.set_colorkey( (0,0,0,0), pygame.RLEACCEL )
    screen.fill( (0,0,0,0) )

    compose()

    # NEON BREAKER : l'écran CHARGEMENT (HTML) reste affiché jusqu'au démarrage du jeu.
    platform.window.canvas.style.visibility = "visible"



    apk = "{{cookiecutter.archive}}.apk"

    bundle = "{{cookiecutter.archive}}"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/{{cookiecutter.archive}}
    appdir.mkdir()


    # mount apk

    cfg = {
        "io": "url",
        "type":"mount",
        "mount" : {
            "point" : appdir.as_posix(),
            "path" : "/",
        },
        "path" : f"/ => {appdir.as_posix()}",
    }


    track = platform.window.MM.prepare(apk, json.dumps(cfg))

    marginx = ux(.020) # 20%
    marginy = uy(.045) # 45%


    def pg_bar(pos):
        nonlocal marginx, marginy
        # resolution of progress bar, recalculate since it may not be know yet.
        total = track.len or 10  # avoid div0
        slot = ux(.060)/ total # 60%

        platform.window.neon.progression(int(track.pos * 100 / total))

    # wait until zip mount + overlayfs is complete
    while not track.ready:
        pg_bar(track.pos)
        compose()
        await asyncio.sleep(.1)

    # fill it up in case it was cached and instant download
    pg_bar(track.len)
    compose()


    # preloader will change dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete
    # that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # start async top level machinery and add a console.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__ that is not yet set
    __import__(__name__).__file__ = str(main)


    # now make a prompt
    fnt = pygame.sysfont.SysFont("freesans",  uy(80) )

    def ui_callback(pkg, error=None):
        if error:
            platform.window.console.error(f"NEON chargement : {error}")

    # test/wait if user media interaction required
    if not platform.window.MM.UME:
        # Le son ne peut démarrer qu'après un geste : on invite à toucher l'écran.
        platform.window.neon.pret()
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # cleanup
    screen.fill( (0,0,0,0) )
    pygame.display.flip()

    await shell.runpy(main, callback=ui_callback)

// Pont entre le jeu (Python) et le navigateur : requêtes HTTP et WebSocket.
// Le jeu n'a pas de fils d'exécution : il lance une requête, puis relève les
// réponses à chaque image (voir moteur/web.py).
window.neon = {
    numero: 0,
    finies: [],
    requete(methode, url, corps, jeton) {
        const n = ++this.numero
        const entetes = {"Content-Type": "application/json"}
        if (jeton) entetes["Authorization"] = "Bearer " + jeton
        const arret = new AbortController()
        const minuteur = setTimeout(() => arret.abort(), 8000)
        fetch(url, {method: methode, headers: entetes, body: corps || undefined, signal: arret.signal})
            .then(r => r.text().then(t => this.finies.push([n, r.status, t])))
            .catch(() => this.finies.push([n, 0, ""]))
            .finally(() => clearTimeout(minuteur))
        return n
    },
    reponses() {
        const texte = JSON.stringify(this.finies)
        this.finies = []
        return texte
    },
    socket: null,
    ws_etat: "ferme",
    ws_erreur: "",
    recus: [],
    ws_ouvrir(url) {
        this.ws_fermer()
        this.recus = []
        this.ws_erreur = ""
        this.ws_etat = "connexion"
        let socket
        try {
            socket = new WebSocket(url)
        } catch (e) {
            this.ws_etat = "erreur"
            this.ws_erreur = String(e)
            return
        }
        this.socket = socket
        socket.onopen = () => { if (this.socket === socket) this.ws_etat = "ouvert" }
        socket.onmessage = (e) => { if (this.socket === socket) this.recus.push(e.data) }
        socket.onerror = () => { if (this.socket === socket) this.ws_erreur = "erreur du WebSocket" }
        socket.onclose = (e) => {
            if (this.socket !== socket) return
            if (this.ws_etat !== "ferme") {
                this.ws_etat = "erreur"
                if (e.code !== 1000) this.ws_erreur = "fermee, code " + e.code + " " + (e.reason || "")
            }
            this.socket = null
        }
    },
    ws_envoyer(texte) {
        if (this.socket && this.socket.readyState === 1) this.socket.send(texte)
    },
    ws_messages() {
        const texte = JSON.stringify(this.recus)
        this.recus = []
        return texte
    },
    ws_fermer() {
        this.ws_etat = "ferme"
        if (this.socket) {
            try { this.socket.close(1000) } catch (e) {}
        }
        this.socket = null
    },
    // Écran CHARGEMENT : avancement, invite à toucher l'écran, puis départ du jeu.
    progression(pourcent) {
        const barre = document.getElementById("progress")
        if (barre) { barre.hidden = false; barre.max = 100; barre.value = pourcent }
    },
    pret() {
        const etat = document.querySelector("#transfer .etat")
        if (etat) {
            etat.textContent = tactile ? "TOUCHE L'ECRAN POUR JOUER" : "CLIQUE POUR JOUER"
            etat.classList.add("invite")
        }
        const barre = document.getElementById("progress")
        if (barre) barre.hidden = true
    },
    parti() {
        const transfert = document.getElementById("transfer")
        if (transfert) transfert.hidden = true
    },
}

// Téléphone : jeu vertical. Tablette : paysage. Plein écran et orientation bloquée au
// premier toucher (Android ; sur iPhone, « Sur l'écran d'accueil » donne le plein écran).
const tactile = window.matchMedia("(pointer: coarse)").matches
const telephone = tactile && Math.min(screen.width, screen.height) < 600
window.neon.telephone = () => telephone
// Hauteur réelle de l'écran : ouvert depuis l'écran d'accueil de l'iPhone, la page passe
// sous la barre d'état mais innerHeight ne la compte pas (le jeu restait trop haut).
function hauteur_ecran() {
    const plein = navigator.standalone || matchMedia("(display-mode: standalone)").matches
                  || matchMedia("(display-mode: fullscreen)").matches
    const portrait = innerHeight >= innerWidth
    if (plein && portrait) return Math.max(innerHeight, screen.height)
    return innerHeight
}
window.neon.proportion = () => {
    const h = hauteur_ecran()
    return Math.max(innerWidth, h) / Math.min(innerWidth, h)
}
// Zones sûres (encoche, barre d'accueil), en pixels de la page.
window.neon.marges = () => {
    const mesure = document.createElement("div")
    mesure.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);" +
                           "padding-bottom:env(safe-area-inset-bottom)"
    document.body.appendChild(mesure)
    const style = getComputedStyle(mesure)
    const marges = {haut: parseFloat(style.paddingTop) || 0, bas: parseFloat(style.paddingBottom) || 0,
                    largeur: innerWidth}
    mesure.remove()
    return JSON.stringify(marges)
}
// Téléphone : le canevas couvre tout l'écran (l'image du jeu a déjà ses proportions).
function placer_canevas() {
    if (!telephone) return
    const canevas = document.getElementById("canvas")
    if (!canevas) return
    canevas.style.position = "fixed"
    canevas.style.left = "0px"
    canevas.style.top = "0px"
    canevas.style.margin = "0"
    canevas.style.width = innerWidth + "px"
    canevas.style.height = hauteur_ecran() + "px"
}
addEventListener("resize", () => setTimeout(placer_canevas, 50))
addEventListener("orientationchange", () => setTimeout(placer_canevas, 300))
setInterval(placer_canevas, 1000)
document.documentElement.classList.add(telephone ? "telephone" : (tactile ? "tablette" : "bureau"))
function plein_ecran() {
    if (!tactile || document.fullscreenElement) return
    const racine = document.documentElement
    if (racine.requestFullscreen) {
        racine.requestFullscreen({navigationUI: "hide"}).then(() => {
            if (screen.orientation && screen.orientation.lock)
                screen.orientation.lock(telephone ? "portrait" : "landscape").catch(() => {})
        }).catch(() => {})
    }
}
window.addEventListener("pointerup", plein_ecran)
window.addEventListener("touchend", plein_ecran)
